name: exp17-route
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  route:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -eux
          git config user.name hum
          git config user.email hum@users.noreply.github.com
          b=exp17-$(date +%s)
          git switch -c "$b"
          echo probe > docs/exp17.md
          git add docs/exp17.md
          git commit -q -m "docs: exp17 route probe"
          git push -q origin "$b"
          gh pr create --base main --head "$b" --title "docs: exp17 route probe" --body "probe"
          gh workflow run check.yml --ref "$b"
          gh pr merge "$b" --auto --squash
