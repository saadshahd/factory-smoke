# Probe for the factory view C spec (2026-11-07): how long an issue comment takes to start a CI run.
name: fvs-answer-probe
on:
  issue_comment:
    types: [created]
jobs:
  pickup:
    if: startsWith(github.event.comment.body, 'fvs-answer ')
    runs-on: ubuntu-latest
    steps:
      - run: echo "comment ${{ github.event.comment.id }} created ${{ github.event.comment.created_at }}; job started $(date -u +%Y-%m-%dT%H:%M:%SZ)"
