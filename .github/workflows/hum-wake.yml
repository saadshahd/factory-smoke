name: hum wake
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      HUM_EVENT: ${{ github.event_name }}
      HUM_KIND: ${{ vars.HUM_KIND }}
      HUM_CHECKS: ${{ vars.HUM_CHECKS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --global @anthropic-ai/claude-code@2.1.316
      - run: |
          claude plugin marketplace add saadshahd/moo.md
          claude plugin install hope@moo.md
      - run: gh auth setup-git
      - run: |
          git config --global user.name "$HUM_GIT_NAME"
          git config --global user.email "$HUM_GIT_EMAIL"
        env:
          HUM_GIT_NAME: hum
          HUM_GIT_EMAIL: hum@moo.md
      - run: ./node_modules/.bin/hum wake --event "$HUM_EVENT"
